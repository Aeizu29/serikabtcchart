<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Serika's Bitcoin Chart</title>
  <!-- TradingView Lightweight Charts -->
  <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: #0a0c12;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, sans-serif;
      padding: 20px;
      gap: 24px;
    }

    .site-logo {
      width: 100%;
      max-width: 460px;     /* ← change this to make the logo bigger or smaller */
      height: auto;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    .monitor-stage {
      position: relative;
      display: inline-block;
      max-width: 1300px;
      width: 100%;
      margin: 0 auto;
      background: #000;
      border-radius: 28px;
      box-shadow: 0 25px 45px rgba(0,0,0,0.6);
    }

    .monitor-stage img {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
      border-radius: 24px;
    }

    .chart-overlay {
      position: absolute;
      left: 0%;
      top: 18%;
      width: 45.6%;
      height: 25.7%;
      background: transparent;
      border-radius: 12px;
      pointer-events: auto;
    }

    #candlestickContainer {
      width: 100%;
      height: 100%;
      background: transparent;
      border-radius: 12px;
    }

    .symbol-badge {
      display: flex;
      align-items: center;
      gap: 0.5em;
      padding: 0.25em 0.7em 0.25em 0.35em;
      background: rgba(20, 22, 30, 0.75);
      border: 1px solid rgba(247, 147, 26, 0.35);
      border-radius: 30px;
      backdrop-filter: blur(8px);
      pointer-events: none;
      font-family: 'Inter', system-ui, sans-serif;
      flex-shrink: 0;
    }
    .symbol-badge .btc-icon {
      width: 1.6em;
      height: 1.6em;
      border-radius: 50%;
      background: #f7931a;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 1em;
      font-family: 'Arial', sans-serif;
      line-height: 1;
    }
    .symbol-badge .pair {
      color: #fff;
      font-size: 1em;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .symbol-badge .pair .quote {
      color: #9aa0a6;
      font-weight: 500;
    }
    .symbol-badge .exchange {
      color: #5841D8;
      font-size: 0.75em;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 0.15em 0.5em;
      border-radius: 10px;
      background: rgba(255, 255, 255, 255);
    }

    .timeframe-bar {
      position: absolute;
      left: 0.1%;
      top: 15.6%;
      width: 45.6%;
      display: flex;
      align-items: center;
      gap: 0.5em;
      justify-content: flex-start;
      z-index: 10;
      pointer-events: auto;
      font-size: clamp(8px, 0.95vw, 12px); /* scales with viewport, not browser zoom */
    }
    .timeframe-bar button {
      background: rgba(20, 22, 30, 0.75);
      border: 1px solid rgba(247, 147, 26, 0.35);
      color: #fff;
      font-family: monospace;
      font-size: 0.95em;
      font-weight: 600;
      padding: 0.25em 0.75em;
      border-radius: 30px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Smooth bouncy transition */
      transform: scale(1);
      flex-shrink: 0;
    }
    /* --- ZOOM ON HOVER --- */
    .timeframe-bar button:hover {
      background: rgba(40, 44, 56, 0.85);
      color: #ffdfa5;
      transform: scale(1.15); /* Simple zoom */
      z-index: 11;
    }
    /* --- ORANGE WHEN CLICKED (MOMENTARY) --- */
    .timeframe-bar button:active {
      background: #f7931a !important;
      color: #000000;
      border-color: #f7931a !important;
      transform: scale(0.95); /* Slight shrink to feel like a real button press */
    }
    /* --- ORANGE WHEN ACTIVE (SELECTED) --- */
    .timeframe-bar button.active {
      background: #f7931a; /* Bitcoin orange for the active state */
      color: #000000;
      border-color: #f7931a;
      transform: scale(1);
    }

  </style>
</head>
<body>
<img src="SerikaBitcoin-Chart_symbolon.png" alt="Serika Bitcoin Chart" class="site-logo">

<div style="position: relative; width: 100%; display: flex; justify-content: center;">
  <div class="monitor-stage" id="monitorStage">
    <!-- Image fixe : image.png dans le même dossier -->
    <img id="monitorBgImg" src="image.png" alt="Monitor background" style="width:100%; border-radius: 24px;">

    <div id="timeframeBar" class="timeframe-bar">
      <div class="symbol-badge">
        <div class="btc-icon">₿</div>
        <div class="pair">BTC<span class="quote">/USDT</span></div>
        <div class="exchange">KRAKEN</div>
      </div>
      <button data-tf="1"     data-limit="60">1m</button>
      <button data-tf="5"     data-limit="60">5m</button>
      <button data-tf="15"    data-limit="60">15m</button>
      <button data-tf="60"    data-limit="48">1h</button>
      <button data-tf="240"   data-limit="60">4h</button>
      <button data-tf="1440"  data-limit="30" class="active">1D</button>
      <button data-tf="10080" data-limit="30">1W</button>
      <button data-tf="21600" data-limit="24">15D</button>
    </div>

    <div id="graphOverlay" class="chart-overlay">
      <div id="candlestickContainer"></div>
    </div>
  </div>
</div>

<script>
  (function() {
    let chart = null;
    let candlestickSeries = null;

    // ---------- Timeframe state ----------
    // Kraken intervals are in minutes
    let currentInterval = 1440; // 1 day
    let currentLimit = 30;

    // ---------- Données Bitcoin via Kraken (US-friendly) ----------
    async function fetchBTCCandles() {
      try {
        const url = `https://api.kraken.com/0/public/OHLC?pair=XBTUSDT&interval=${currentInterval}`;
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const json = await response.json();

        if (json.error && json.error.length > 0) {
          throw new Error(`Kraken: ${json.error.join(", ")}`);
        }

        // Find the result key (Kraken sometimes prefixes pair names)
        const resultKey = Object.keys(json.result).find(k => k !== "last");
        const raw = json.result[resultKey];

        // Kraken returns: [time, open, high, low, close, vwap, volume, count]
        // Time is already in seconds
        const candles = raw.map(c => ({
          time:  c[0],
          open:  parseFloat(c[1]),
          high:  parseFloat(c[2]),
          low:   parseFloat(c[3]),
          close: parseFloat(c[4])
        }));

        // Trim to currentLimit (Kraken always returns up to 720)
        return candles.slice(-currentLimit);
      } catch (err) {
        console.warn("Kraken fetch failed:", err.message);
        return [];
      }
    }

    async function initChart() {
      const container = document.getElementById('candlestickContainer');
      if (!container) return;
      if (chart) chart.remove();

      const width = container.clientWidth;
      const height = container.clientHeight;
      if (width < 100 || height < 100) return;

      chart = LightweightCharts.createChart(container, {
        width, height,
        layout: { background: { color: 'transparent' }, textColor: '#d1d4dc' },
        grid: { vertLines: { color: 'rgba(42,46,57,0.3)' }, horzLines: { color: 'rgba(42,46,57,0.3)' } },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal, vertLine: { color: '#ffcd7e' }, horzLine: { color: '#ffcd7e' } },
        rightPriceScale: { borderColor: 'rgba(197,203,216,0.2)' },
        timeScale: { borderColor: 'rgba(197,203,216,0.2)', timeVisible: true }
      });

      candlestickSeries = chart.addCandlestickSeries({
        upColor: '#26a69a', downColor: '#ef5350',
        borderDownColor: '#ef5350', borderUpColor: '#26a69a',
        wickDownColor: '#ef5350', wickUpColor: '#26a69a'
      });

      const candles = await fetchBTCCandles();
      candlestickSeries.setData(candles);
      chart.timeScale().fitContent();
    }

    function resizeChart() {
      if (!chart) return;
      const container = document.getElementById('candlestickContainer');
      if (!container) return;
      const w = container.clientWidth, h = container.clientHeight;
      if (w > 0 && h > 0) {
        chart.applyOptions({ width: w, height: h });
        chart.timeScale().fitContent();
      }
    }

    // ----- Overlay reference -----
    const overlay = document.getElementById('graphOverlay');

    // Rafraîchissement auto toutes les 5 min
    let refreshInterval;
    async function refreshData() {
      if (candlestickSeries) {
        const candles = await fetchBTCCandles();
        candlestickSeries.setData(candles);
        chart.timeScale().fitContent();
      }
    }
    function startAutoRefresh() {
      if (refreshInterval) clearInterval(refreshInterval);
      refreshInterval = setInterval(refreshData, 300000);
    }

    // ----- Timeframe buttons -----
    function setupTimeframeButtons() {
      const buttons = document.querySelectorAll('#timeframeBar button');
      buttons.forEach(btn => {
        btn.addEventListener('click', async () => {
          buttons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentInterval = parseInt(btn.dataset.tf, 10);
          currentLimit = parseInt(btn.dataset.limit, 10);
          await refreshData();
        });
      });
    }

    // Initialisation
    async function init() {
      overlay.style.left = "0%"; overlay.style.top = "18%";
      overlay.style.width = "45.6%"; overlay.style.height = "25.7%";
      await initChart();
      setupTimeframeButtons();
      startAutoRefresh();
      window.addEventListener('resize', () => setTimeout(resizeChart, 100));
      new ResizeObserver(() => resizeChart()).observe(document.getElementById('candlestickContainer'));
      const img = document.getElementById('monitorBgImg');
      if (img.complete) setTimeout(resizeChart, 100);
      img.addEventListener('load', () => setTimeout(resizeChart, 100));
    }
    init();
  })();
</script>
</body>
</html>
