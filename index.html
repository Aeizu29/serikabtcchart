<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bitcoin · Chandeliers interactifs</title>
  <!-- TradingView Lightweight Charts -->
  <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: #0a0c12;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, sans-serif;
      padding: 20px;
      gap: 24px;
    }

    .site-logo {
      width: 100%;
      max-width: 460px;     /* ← change this to make the logo bigger or smaller */
      height: auto;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    .monitor-stage {
      position: relative;
      display: inline-block;
      max-width: 1300px;
      width: 100%;
      margin: 0 auto;
      background: #000;
      border-radius: 28px;
      box-shadow: 0 25px 45px rgba(0,0,0,0.6);
      container-type: inline-size; /* enables cqw units for children */
    }

    .monitor-stage img {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
      border-radius: 24px;
    }

    .chart-overlay {
      position: absolute;
      left: 0%;
      top: 18%;
      width: 45.6%;
      height: 25.7%;
      background: transparent;
      border-radius: 12px;
      pointer-events: auto;
    }

    #candlestickContainer {
      width: 100%;
      height: 100%;
      background: transparent;
      border-radius: 12px;
    }

    /* ============================================
       MASTER SIZE — change this ONE number to resize
       everything (badge + buttons) proportionally.
       The unit "cqw" = % of the monitor-stage width,
       so the bar stays in lockstep with the chart at
       any browser zoom or window size.
       Default: 0.95. Try 0.8 for smaller, 1.2 for bigger.
       ============================================ */
    .timeframe-bar,
    .symbol-badge {
      --base: 0.80cqw;
    }

    .symbol-badge {
      display: flex;
      align-items: center;
      gap: calc(var(--base) * 0.5);
      padding: calc(var(--base) * 0.27) calc(var(--base) * 0.7) calc(var(--base) * 0.27) calc(var(--base) * 0.36);
      background: rgba(20, 22, 30, 0.75);
      border: 1px solid rgba(247, 147, 26, 0.35);
      border-radius: 30px;
      backdrop-filter: blur(8px);
      pointer-events: none;
      font-family: 'Inter', system-ui, sans-serif;
      flex-shrink: 0;
    }
    .symbol-badge .btc-icon {
      width: calc(var(--base) * 1.6);
      height: calc(var(--base) * 1.6);
      border-radius: 50%;
      background: #f7931a;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: calc(var(--base) * 1.1);
      font-family: 'Arial', sans-serif;
      line-height: 1;
    }
    .symbol-badge .pair {
      color: #fff;
      font-size: var(--base);
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .symbol-badge .pair .quote {
      color: #9aa0a6;
      font-weight: 500;
    }
    .symbol-badge .exchange {
      color: #5841D8;
      font-size: calc(var(--base) * 0.82);
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: calc(var(--base) * 0.18) calc(var(--base) * 0.55);
      border-radius: 10px;
      background: rgba(255, 255, 255, 255);
    }

    .timeframe-bar {
      position: absolute;
      left: 0.1%;
      top: 15.6%;
      width: 45.6%;
      display: flex;
      align-items: center;
      gap: calc(var(--base) * 0.55);
      justify-content: flex-start;
      z-index: 10;
      pointer-events: auto;
    }
    .timeframe-bar button {
      background: rgba(20, 22, 30, 0.75);
      border: 1px solid rgba(247, 147, 26, 0.35);
      color: #fff;
      font-family: monospace;
      font-size: var(--base);
      font-weight: 600;
      padding: calc(var(--base) * 0.27) calc(var(--base) * 0.82);
      border-radius: 30px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Smooth bouncy transition */
      transform: scale(1);
      flex-shrink: 0;
    }
    /* --- ZOOM ON HOVER (desktop / mouse only) --- */
    @media (hover: hover) and (pointer: fine) {
      .timeframe-bar button:hover {
        background: rgba(40, 44, 56, 0.85);
        color: #ffdfa5;
        transform: scale(1.15); /* Simple zoom */
        z-index: 11;
      }
    }
    /* --- ORANGE WHEN CLICKED (MOMENTARY) --- */
    .timeframe-bar button:active {
      background: #f7931a !important;
      color: #000000;
      border-color: #f7931a !important;
      transform: scale(0.95); /* Slight shrink to feel like a real button press */
    }
    /* --- ORANGE WHEN ACTIVE (SELECTED) --- */
    .timeframe-bar button.active {
      background: #f7931a; /* Bitcoin orange for the active state */
      color: #000000;
      border-color: #f7931a;
      transform: scale(1);
    }

    /* --- MOBILE: smaller, fixed-size buttons that don't zoom --- */
    @media (max-width: 768px) {
      .timeframe-bar {
        font-size: 9px; /* fixed size, no zoom on small screens */
        gap: 0.3em;
      }
      .timeframe-bar button {
        padding: 0.2em 0.55em;
      }
      /* Disable any transform-based scaling on mobile so buttons never balloon */
      .timeframe-bar button:hover,
      .timeframe-bar button:active,
      .timeframe-bar button.active {
        transform: scale(1) !important;
      }
    }

  </style>
</head>
<body>
<img src="SerikaBitcoin-Chart_symbolon.png" alt="Serika Bitcoin Chart" class="site-logo">

<div style="position: relative; width: 100%; display: flex; justify-content: center;">
  <div class="monitor-stage" id="monitorStage">
    <!-- Image fixe : image.png dans le même dossier -->
    <img id="monitorBgImg" src="image.png" alt="Monitor background" style="width:100%; border-radius: 24px;">

    <div id="timeframeBar" class="timeframe-bar">
      <div class="symbol-badge">
        <div class="btc-icon">₿</div>
        <div class="pair">BTC<span class="quote">/USDT</span></div>
        <div class="exchange">KRAKEN</div>
      </div>
      <button data-tf="1"     data-limit="60">1m</button>
      <button data-tf="5"     data-limit="60">5m</button>
      <button data-tf="15"    data-limit="60">15m</button>
      <button data-tf="60"    data-limit="48">1h</button>
      <button data-tf="240"   data-limit="60">4h</button>
      <button data-tf="1440"  data-limit="30" class="active">1D</button>
      <button data-tf="10080" data-limit="30">1W</button>
      <button data-tf="21600" data-limit="24">15D</button>
    </div>

    <div id="graphOverlay" class="chart-overlay">
      <div id="candlestickContainer"></div>
    </div>
  </div>
</div>

<script>
  (function() {
    let chart = null;
    let candlestickSeries = null;

    // ---------- Timeframe state ----------
    // Kraken intervals are in minutes
    let currentInterval = 1440; // 1 day
    let currentLimit = 30;

    // ---------- Données Bitcoin (Kraken primary, Coinbase fallback) ----------
    let currentSource = "KRAKEN"; // tracks which API actually served the data

    async function fetchFromKraken() {
      const url = `https://api.kraken.com/0/public/OHLC?pair=XBTUSDT&interval=${currentInterval}`;
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) throw new Error(`Kraken HTTP ${response.status}`);
      const json = await response.json();
      if (json.error && json.error.length > 0) throw new Error(`Kraken: ${json.error.join(", ")}`);
      const resultKey = Object.keys(json.result).find(k => k !== "last");
      const raw = json.result[resultKey];
      if (!raw || !raw.length) throw new Error("Kraken: empty result");
      return raw.map(c => ({
        time:  c[0],
        open:  parseFloat(c[1]),
        high:  parseFloat(c[2]),
        low:   parseFloat(c[3]),
        close: parseFloat(c[4])
      })).slice(-currentLimit);
    }

    async function fetchFromCoinbase() {
      // Coinbase granularity (seconds) — map our Kraken minute intervals
      const granularityMap = {
        1: 60, 5: 300, 15: 900, 60: 3600, 240: 21600,
        1440: 86400, 10080: 86400, 21600: 86400 // weekly/15D fall back to daily
      };
      const granularity = granularityMap[currentInterval] || 86400;
      const url = `https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=${granularity}`;
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) throw new Error(`Coinbase HTTP ${response.status}`);
      const data = await response.json();
      if (!Array.isArray(data) || !data.length) throw new Error("Coinbase: empty result");
      // Coinbase returns: [time, low, high, open, close, volume] — newest first, in seconds
      return data
        .map(c => ({ time: c[0], open: c[3], high: c[2], low: c[1], close: c[4] }))
        .sort((a, b) => a.time - b.time)
        .slice(-currentLimit);
    }

    async function fetchBTCCandles() {
      // Try Kraken first
      try {
        const data = await fetchFromKraken();
        setSource("KRAKEN");
        return data;
      } catch (err) {
        console.warn("Kraken failed, falling back to Coinbase:", err.message);
      }
      // Fallback: Coinbase (also US-friendly, works on Opera mobile)
      try {
        const data = await fetchFromCoinbase();
        setSource("COINBASE");
        return data;
      } catch (err) {
        console.warn("Coinbase fallback also failed:", err.message);
        return [];
      }
    }

    // Update the exchange badge to reflect which API is currently serving data
    function setSource(name) {
      if (currentSource === name) return; // no change
      currentSource = name;
      const el = document.querySelector('.symbol-badge .exchange');
      if (!el) return;
      el.textContent = name;
      if (name === "COINBASE") {
        el.style.color = "#0857FF";
      } else {
        // KRAKEN — let CSS take over (whatever color you set in your stylesheet)
        el.style.color = "";
      }
    }

    // Wait until the chart container has valid dimensions before drawing
    function waitForContainer(maxAttempts = 50) {
      return new Promise((resolve) => {
        let attempts = 0;
        function check() {
          const container = document.getElementById('candlestickContainer');
          if (container && container.clientWidth >= 100 && container.clientHeight >= 100) {
            resolve(container);
            return;
          }
          if (++attempts >= maxAttempts) {
            resolve(container); // give up after ~5s, draw anyway
            return;
          }
          setTimeout(check, 100);
        }
        check();
      });
    }

    async function initChart() {
      const container = await waitForContainer();
      if (!container) return;
      if (chart) chart.remove();

      const width = Math.max(container.clientWidth, 100);
      const height = Math.max(container.clientHeight, 100);

      chart = LightweightCharts.createChart(container, {
        width, height,
        layout: { background: { color: 'transparent' }, textColor: '#d1d4dc' },
        grid: { vertLines: { color: 'rgba(42,46,57,0.3)' }, horzLines: { color: 'rgba(42,46,57,0.3)' } },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal, vertLine: { color: '#ffcd7e' }, horzLine: { color: '#ffcd7e' } },
        rightPriceScale: { borderColor: 'rgba(197,203,216,0.2)' },
        timeScale: { borderColor: 'rgba(197,203,216,0.2)', timeVisible: true }
      });

      candlestickSeries = chart.addCandlestickSeries({
        upColor: '#26a69a', downColor: '#ef5350',
        borderDownColor: '#ef5350', borderUpColor: '#26a69a',
        wickDownColor: '#ef5350', wickUpColor: '#26a69a'
      });

      const candles = await fetchBTCCandles();
      if (candles.length > 0) {
        candlestickSeries.setData(candles);
        chart.timeScale().fitContent();
      }

      // Force several resize passes after init to handle late layout shifts
      [50, 200, 500, 1000].forEach(delay => {
        setTimeout(() => {
          resizeChart();
          if (chart) chart.timeScale().fitContent();
        }, delay);
      });
    }

    function resizeChart() {
      if (!chart) return;
      const container = document.getElementById('candlestickContainer');
      if (!container) return;
      const w = container.clientWidth, h = container.clientHeight;
      if (w > 0 && h > 0) {
        chart.applyOptions({ width: w, height: h });
        chart.timeScale().fitContent();
      }
    }

    // ----- Overlay reference -----
    const overlay = document.getElementById('graphOverlay');

    // Rafraîchissement auto toutes les 5 min
    let refreshInterval;
    async function refreshData() {
      if (candlestickSeries) {
        const candles = await fetchBTCCandles();
        candlestickSeries.setData(candles);
        chart.timeScale().fitContent();
      }
    }
    function startAutoRefresh() {
      if (refreshInterval) clearInterval(refreshInterval);
      refreshInterval = setInterval(refreshData, 300000);
    }

    // ----- Timeframe buttons -----
    function setupTimeframeButtons() {
      const buttons = document.querySelectorAll('#timeframeBar button');
      buttons.forEach(btn => {
        btn.addEventListener('click', async () => {
          buttons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentInterval = parseInt(btn.dataset.tf, 10);
          currentLimit = parseInt(btn.dataset.limit, 10);
          await refreshData();
        });
      });
    }

    // Wait for the background image to fully load before drawing the chart
    function waitForBgImage() {
      return new Promise((resolve) => {
        const img = document.getElementById('monitorBgImg');
        if (!img) { resolve(); return; }
        if (img.complete && img.naturalHeight !== 0) { resolve(); return; }
        img.addEventListener('load',  () => resolve(), { once: true });
        img.addEventListener('error', () => resolve(), { once: true });
        setTimeout(resolve, 3000);
      });
    }

    // Retry data fetch if it failed (helps on flaky mobile connections)
    async function ensureDataLoaded(maxRetries = 3) {
      for (let i = 0; i < maxRetries; i++) {
        if (!candlestickSeries) return;
        const candles = await fetchBTCCandles();
        if (candles.length > 0) {
          candlestickSeries.setData(candles);
          chart.timeScale().fitContent();
          return;
        }
        // Wait a bit longer between retries
        await new Promise(r => setTimeout(r, 800 * (i + 1)));
      }
      console.warn("All data fetch attempts failed");
    }

    // Initialisation
    async function init() {
      overlay.style.left = "0%"; overlay.style.top = "18%";
      overlay.style.width = "45.6%"; overlay.style.height = "25.7%";

      await waitForBgImage();
      await initChart();

      // If the chart loaded but no data came through, retry a few times
      if (candlestickSeries && chart) {
        // Check if data is empty by trying again on next tick
        setTimeout(async () => {
          const candles = await fetchBTCCandles();
          if (candles.length === 0) {
            await ensureDataLoaded();
          } else {
            candlestickSeries.setData(candles);
            chart.timeScale().fitContent();
          }
        }, 300);
      }

      setupTimeframeButtons();
      startAutoRefresh();

      window.addEventListener('resize', () => setTimeout(resizeChart, 100));
      new ResizeObserver(() => resizeChart()).observe(document.getElementById('candlestickContainer'));

      window.addEventListener('load', () => {
        setTimeout(() => {
          resizeChart();
          if (chart) chart.timeScale().fitContent();
        }, 200);
      });
    }
    init();
  })();
</script>
</body>
</html>
