<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>S&P 500 — Daily Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e10;
    --bg-elevated: #16161a;
    --bg-card: #1a1a1f;
    --border: #26262d;
    --border-soft: #1f1f25;
    --text: #f4f4f5;
    --text-muted: #8a8a93;
    --text-dim: #5b5b63;
    --up: #2dd66f;
    --up-soft: rgba(45, 214, 111, 0.10);
    --up-glow: rgba(45, 214, 111, 0.35);
    --down: #ff4d6d;
    --down-soft: rgba(255, 77, 109, 0.10);
    --down-glow: rgba(255, 77, 109, 0.35);
    --accent: #f5d76e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  body {
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(245, 215, 110, 0.08), transparent),
      radial-gradient(ellipse 60% 40% at 100% 0%, rgba(45, 214, 111, 0.04), transparent);
  }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 48px 32px 80px; }

  header {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 40px; padding-bottom: 24px;
    border-bottom: 1px solid var(--border-soft);
    gap: 24px; flex-wrap: wrap;
  }
  .brand { display: flex; flex-direction: column; gap: 6px; }
  .brand .eyebrow {
    font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--text-dim);
  }
  .brand h1 {
    font-family: 'Fraunces', serif; font-weight: 400;
    font-size: clamp(32px, 5vw, 52px);
    letter-spacing: -0.02em; line-height: 1;
  }
  .brand h1 em { font-style: italic; font-weight: 300; color: var(--accent); }

  .meta { text-align: right; color: var(--text-muted); font-size: 12px; letter-spacing: 0.04em; }
  .meta .live { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .meta .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim); transition: background 0.3s;
  }
  .meta .dot.live-on {
    background: var(--up);
    box-shadow: 0 0 0 0 var(--up-glow);
    animation: pulse 2s infinite;
  }
  .meta .dot.live-error { background: var(--down); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 var(--up-glow); }
    70% { box-shadow: 0 0 0 8px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  .meta .refresh-btn {
    margin-left: 8px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 2px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    transition: all 0.15s;
  }
  .meta .refresh-btn:hover { color: var(--text); border-color: var(--text-muted); }

  .status-banner {
    display: none;
    background: var(--bg-elevated);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 14px 20px;
    margin-bottom: 24px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .status-banner.show { display: block; }
  .status-banner.error { border-color: rgba(255, 77, 109, 0.3); color: var(--down); }

  .hero {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr 1fr;
    gap: 1px;
    background: var(--border-soft);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 40px;
    min-height: 140px;
  }
  .stat { background: var(--bg-elevated); padding: 24px 28px; }
  .stat .label {
    font-size: 10px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--text-dim);
    margin-bottom: 12px;
  }
  .stat .value {
    font-family: 'Fraunces', serif; font-weight: 400;
    font-size: 36px; letter-spacing: -0.02em; line-height: 1;
  }
  .stat .sub { margin-top: 8px; font-size: 12px; color: var(--text-muted); }
  .stat.primary .value { font-size: 52px; }
  .stat .change {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 10px; padding: 4px 10px;
    border-radius: 999px; font-size: 12px; font-weight: 500;
  }
  .stat .change.up { background: var(--up-soft); color: var(--up); }
  .stat .change.down { background: var(--down-soft); color: var(--down); }

  .chart-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    padding: 28px 28px 20px;
    margin-bottom: 40px;
  }
  .chart-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; gap: 16px; flex-wrap: wrap;
  }
  .chart-head h2 {
    font-family: 'Fraunces', serif; font-weight: 400;
    font-size: 22px; letter-spacing: -0.01em;
  }
  .chart-head .range-info {
    font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-dim);
  }

  .range-tabs {
    display: flex; gap: 2px;
    background: var(--bg-card);
    padding: 3px;
    border-radius: 8px;
    border: 1px solid var(--border-soft);
  }
  .range-tabs button {
    background: transparent; border: none;
    color: var(--text-muted);
    font-family: inherit; font-size: 11px; font-weight: 500;
    letter-spacing: 0.08em;
    padding: 6px 12px; border-radius: 6px;
    cursor: pointer; transition: all 0.15s;
  }
  .range-tabs button:hover { color: var(--text); }
  .range-tabs button.active {
    background: var(--bg-elevated);
    color: var(--accent);
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }

  #chart { width: 100%; height: 320px; display: block; cursor: crosshair; }

  .chart-tooltip {
    position: absolute; pointer-events: none;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    opacity: 0; transition: opacity 0.12s;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    z-index: 10; white-space: nowrap;
  }
  .chart-tooltip.show { opacity: 1; }
  .chart-tooltip .tt-date {
    color: var(--text-muted); font-size: 10px;
    letter-spacing: 0.08em; text-transform: uppercase;
    margin-bottom: 4px;
  }
  .chart-tooltip .tt-price {
    font-family: 'Fraunces', serif; font-size: 18px; font-weight: 500;
  }
  .chart-tooltip .tt-pct { font-size: 11px; margin-top: 2px; }
  .chart-tooltip .tt-pct.up { color: var(--up); }
  .chart-tooltip .tt-pct.down { color: var(--down); }

  .chart-wrap { position: relative; }

  .table-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    overflow: hidden;
  }
  .table-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 24px 28px 18px;
    border-bottom: 1px solid var(--border-soft);
  }
  .table-head h2 {
    font-family: 'Fraunces', serif; font-weight: 400;
    font-size: 22px; letter-spacing: -0.01em;
  }
  .table-head .legend {
    display: flex; gap: 16px;
    font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-muted);
  }
  .table-head .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .table-head .legend i {
    width: 8px; height: 8px; border-radius: 2px;
    display: inline-block;
  }
  .legend .ig { background: var(--up); }
  .legend .ir { background: var(--down); }

  table {
    width: 100%; border-collapse: collapse;
    font-variant-numeric: tabular-nums;
  }
  thead th {
    text-align: left; padding: 14px 28px;
    font-size: 10px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--text-dim);
    font-weight: 500; background: var(--bg-card);
    border-bottom: 1px solid var(--border-soft);
  }
  thead th.num { text-align: right; }
  tbody tr {
    border-bottom: 1px solid var(--border-soft);
    transition: background 0.15s ease;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--bg-card); }
  tbody td { padding: 16px 28px; font-size: 13px; }
  tbody td.num { text-align: right; font-variant-numeric: tabular-nums; }

  td.date .day {
    font-family: 'Fraunces', serif; font-size: 18px;
    font-weight: 400; letter-spacing: -0.01em;
  }
  td.date .full {
    font-size: 11px; color: var(--text-muted);
    letter-spacing: 0.05em; margin-top: 2px;
  }
  td.close { color: var(--text); font-weight: 500; }
  td.diff { color: var(--text-muted); }

  td.pct { font-weight: 600; letter-spacing: -0.01em; }
  td.pct .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 11px; border-radius: 6px;
    font-size: 13px; min-width: 92px;
    justify-content: flex-end;
  }
  td.pct .pill.up {
    background: var(--up-soft); color: var(--up);
    border: 1px solid rgba(45, 214, 111, 0.2);
  }
  td.pct .pill.down {
    background: var(--down-soft); color: var(--down);
    border: 1px solid rgba(255, 77, 109, 0.2);
  }
  .arrow { font-size: 10px; }

  footer {
    margin-top: 48px; padding-top: 24px;
    border-top: 1px solid var(--border-soft);
    display: flex; justify-content: space-between;
    color: var(--text-dim); font-size: 11px;
    letter-spacing: 0.06em;
    flex-wrap: wrap; gap: 12px;
  }
  footer a { color: var(--text-muted); text-decoration: none; }
  footer a:hover { color: var(--accent); }

  .skeleton {
    background: linear-gradient(90deg, var(--bg-card) 0%, var(--border) 50%, var(--bg-card) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 6px;
    color: transparent !important;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  @media (max-width: 820px) {
    .wrap { padding: 32px 18px 60px; }
    header { flex-direction: column; align-items: flex-start; gap: 14px; }
    .meta { text-align: left; }
    .hero { grid-template-columns: 1fr 1fr; }
    .stat.primary { grid-column: 1 / -1; }
    .stat.primary .value { font-size: 44px; }
    thead th, tbody td { padding: 12px 16px; }
    thead th.diff-col, td.diff { display: none; }
    .table-head, .chart-card { padding-left: 18px; padding-right: 18px; }
    .table-head { flex-direction: column; align-items: flex-start; gap: 10px; }
    .chart-head { flex-direction: column; align-items: flex-start; }
    .range-tabs button { padding: 6px 9px; font-size: 10px; }
  }
</style>
</head>
<body>
  <div class="wrap">

    <header>
      <div class="brand">
        <span class="eyebrow">Daily Index Tracker</span>
        <h1>S&amp;P <em>500</em></h1>
      </div>
      <div class="meta">
        <div class="live">
          <span class="dot" id="live-dot"></span>
          <span id="live-text">Connecting…</span>
          <button class="refresh-btn" id="refresh-btn" title="Refresh data">↻</button>
        </div>
        <div id="source-text">Source: Stooq · End-of-day data</div>
      </div>
    </header>

    <div class="status-banner" id="status-banner"></div>

    <section class="hero" id="hero">
      <div class="stat primary">
        <div class="label">Latest Close</div>
        <div class="value skeleton">0000.00</div>
      </div>
      <div class="stat"><div class="label">Range</div><div class="value skeleton">000%</div></div>
      <div class="stat"><div class="label">High</div><div class="value skeleton">0000.00</div></div>
      <div class="stat"><div class="label">Low</div><div class="value skeleton">0000.00</div></div>
    </section>

    <section class="chart-card">
      <div class="chart-head">
        <h2>Price history</h2>
        <div class="range-tabs" id="range-tabs">
          <button data-range="1M">1M</button>
          <button data-range="3M" class="active">3M</button>
          <button data-range="6M">6M</button>
          <button data-range="1Y">1Y</button>
          <button data-range="5Y">5Y</button>
          <button data-range="ALL">ALL</button>
        </div>
        <span class="range-info" id="range-info">—</span>
      </div>
      <div class="chart-wrap">
        <svg id="chart" viewBox="0 0 1000 320" preserveAspectRatio="none"></svg>
        <div class="chart-tooltip" id="tooltip">
          <div class="tt-date"></div>
          <div class="tt-price"></div>
          <div class="tt-pct"></div>
        </div>
      </div>
    </section>

    <section class="table-card">
      <div class="table-head">
        <h2>Daily breakdown</h2>
        <div class="legend">
          <span><i class="ig"></i> Gain</span>
          <span><i class="ir"></i> Loss</span>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th class="num">Close</th>
            <th class="num diff-col">Δ Points</th>
            <th class="num">Change</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>

    <footer>
      <span>Historical close prices · Free data via Stooq</span>
      <a href="https://stooq.com/q/?s=^spx" target="_blank" rel="noopener">View source →</a>
    </footer>

  </div>

<script>
const STOOQ_URL = 'https://stooq.com/q/d/l/?s=^spx&i=d';
const CACHE_KEY = 'sp500_data_v2';
const CACHE_FRESH_MS = 5 * 60 * 1000;
const REFRESH_INTERVAL_MS = 60 * 60 * 1000;

let allData = [];
let currentRange = '3M';
let viewData = [];

async function fetchData() {
  setLive('connecting', 'Fetching…');
  try {
    const res = await fetch(STOOQ_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const csv = await res.text();
    const parsed = parseCSV(csv);
    if (!parsed.length) throw new Error('No data returned');

    allData = parsed;
    saveCache(parsed);
    setLive('on', `Updated ${formatTime(new Date())}`);
    hideStatus();
    render();
  } catch (err) {
    console.error('Fetch failed:', err);
    const cached = loadCache();
    if (cached && cached.data.length) {
      allData = cached.data;
      setLive('error', 'Live fetch failed — showing cached');
      showStatus(`Couldn't reach Stooq. Showing cached data from ${formatTime(new Date(cached.savedAt))}.`, true);
      render();
    } else {
      setLive('error', 'Connection failed');
      showStatus(`Could not load data: ${err.message}. If opening this file directly (file://), CORS may block the fetch — try serving via a local web server (e.g. \`python3 -m http.server\`).`, true);
    }
  }
}

function parseCSV(csv) {
  const lines = csv.trim().split(/\r?\n/);
  const out = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(',');
    if (cols.length < 5) continue;
    const date = cols[0];
    const close = parseFloat(cols[4]);
    if (!date || isNaN(close)) continue;
    out.push({ date, close });
  }
  return out;
}

function saveCache(data) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ data, savedAt: Date.now() })); }
  catch (e) {}
}
function loadCache() {
  try { const raw = localStorage.getItem(CACHE_KEY); return raw ? JSON.parse(raw) : null; }
  catch (e) { return null; }
}

const liveDot = document.getElementById('live-dot');
const liveText = document.getElementById('live-text');
const statusBanner = document.getElementById('status-banner');

function setLive(state, text) {
  liveDot.className = 'dot';
  if (state === 'on') liveDot.classList.add('live-on');
  if (state === 'error') liveDot.classList.add('live-error');
  liveText.textContent = text;
}
function showStatus(msg, isError) {
  statusBanner.textContent = msg;
  statusBanner.className = 'status-banner show' + (isError ? ' error' : '');
}
function hideStatus() { statusBanner.className = 'status-banner'; }
function formatTime(d) { return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }); }

const fmt = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtPct = n => (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
const fmtDiff = n => (n >= 0 ? '+' : '') + n.toFixed(2);

function sliceByRange(data, range) {
  if (range === 'ALL') return data;
  const days = { '1M': 22, '3M': 66, '6M': 130, '1Y': 252, '5Y': 1260 }[range];
  return data.slice(-days);
}

function render() {
  if (!allData.length) return;
  viewData = sliceByRange(allData, currentRange);
  const enriched = viewData.map((d, i) => {
    const prevClose = i === 0
      ? (allData.indexOf(d) > 0 ? allData[allData.indexOf(d) - 1].close : d.close)
      : viewData[i - 1].close;
    const diff = d.close - prevClose;
    const pct = (diff / prevClose) * 100;
    return { ...d, diff, pct };
  });
  renderHero(enriched);
  renderChart(enriched);
  renderTable(enriched);
  renderRangeInfo(enriched);
}

function renderHero(data) {
  const latest = data[data.length - 1];
  const high = Math.max(...data.map(d => d.close));
  const low = Math.min(...data.map(d => d.close));
  const rangeChange = ((latest.close - data[0].close) / data[0].close) * 100;
  const highDate = data.find(d => d.close === high).date;
  const lowDate = data.find(d => d.close === low).date;

  document.getElementById('hero').innerHTML = `
    <div class="stat primary">
      <div class="label">Latest Close · ${formatDate(latest.date)}</div>
      <div class="value">${fmt(latest.close)}</div>
      <span class="change ${latest.pct >= 0 ? 'up' : 'down'}">
        ${latest.pct >= 0 ? '▲' : '▼'} ${fmtDiff(latest.diff)} · ${fmtPct(latest.pct)}
      </span>
    </div>
    <div class="stat">
      <div class="label">${currentRange} Range</div>
      <div class="value" style="color:${rangeChange >= 0 ? 'var(--up)' : 'var(--down)'}">${fmtPct(rangeChange)}</div>
      <div class="sub">From ${formatDate(data[0].date)}</div>
    </div>
    <div class="stat">
      <div class="label">Period High</div>
      <div class="value">${fmt(high)}</div>
      <div class="sub">${formatDate(highDate)}</div>
    </div>
    <div class="stat">
      <div class="label">Period Low</div>
      <div class="value">${fmt(low)}</div>
      <div class="sub">${formatDate(lowDate)}</div>
    </div>
  `;
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function formatDateShort(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function renderRangeInfo(data) {
  const el = document.getElementById('range-info');
  el.textContent = `${formatDateShort(data[0].date)} – ${formatDateShort(data[data.length - 1].date)} · ${data.length} sessions`;
}

const svg = document.getElementById('chart');
const tooltip = document.getElementById('tooltip');
const W = 1000, H = 320, PAD_L = 60, PAD_R = 20, PAD_T = 24, PAD_B = 36;
let chartPts = [];

function renderChart(data) {
  if (!data.length) { svg.innerHTML = ''; return; }

  const closes = data.map(d => d.close);
  const minV = Math.min(...closes);
  const maxV = Math.max(...closes);
  const padV = Math.max((maxV - minV) * 0.12, 1);
  const yMin = minV - padV, yMax = maxV + padV;

  const x = i => PAD_L + (data.length === 1 ? 0 : (i / (data.length - 1)) * (W - PAD_L - PAD_R));
  const y = v => PAD_T + (1 - (v - yMin) / (yMax - yMin)) * (H - PAD_T - PAD_B);

  chartPts = data.map((d, i) => ({ x: x(i), y: y(d.close), d }));

  const overallUp = data[data.length - 1].close >= data[0].close;
  const fillId = overallUp ? 'gradUp' : 'gradDown';
  const stroke = overallUp ? '#2dd66f' : '#ff4d6d';

  let path = '';
  data.forEach((d, i) => {
    path += (i === 0 ? 'M' : 'L') + ` ${x(i).toFixed(2)} ${y(d.close).toFixed(2)} `;
  });
  const baseY = (H - PAD_B).toFixed(2);
  const area = path + ` L ${x(data.length - 1).toFixed(2)} ${baseY} L ${x(0).toFixed(2)} ${baseY} Z`;

  const ticks = 4;
  let gridLines = '', yLabels = '';
  for (let i = 0; i <= ticks; i++) {
    const v = yMin + ((yMax - yMin) * i / ticks);
    const yy = y(v);
    gridLines += `<line x1="${PAD_L}" y1="${yy}" x2="${W - PAD_R}" y2="${yy}" stroke="#1f1f25" stroke-width="1" />`;
    yLabels += `<text x="${PAD_L - 10}" y="${yy + 4}" fill="#5b5b63" font-size="11" text-anchor="end" font-family="JetBrains Mono">${Math.round(v).toLocaleString()}</text>`;
  }

  const xTickCount = Math.min(6, data.length);
  let xLabels = '';
  for (let t = 0; t < xTickCount; t++) {
    const i = Math.round((t / (xTickCount - 1)) * (data.length - 1));
    const d = new Date(data[i].date);
    const lbl = data.length > 252
      ? d.toLocaleDateString('en-US', { month: 'short', year: '2-digit' })
      : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const anchor = t === 0 ? 'start' : t === xTickCount - 1 ? 'end' : 'middle';
    xLabels += `<text x="${x(i)}" y="${H - 12}" fill="#5b5b63" font-size="11" text-anchor="${anchor}" font-family="JetBrains Mono">${lbl}</text>`;
  }

  const lastX = x(data.length - 1);
  const lastY = y(data[data.length - 1].close);

  svg.innerHTML = `
    <defs>
      <linearGradient id="gradUp" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#2dd66f" stop-opacity="0.28" />
        <stop offset="100%" stop-color="#2dd66f" stop-opacity="0" />
      </linearGradient>
      <linearGradient id="gradDown" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#ff4d6d" stop-opacity="0.28" />
        <stop offset="100%" stop-color="#ff4d6d" stop-opacity="0" />
      </linearGradient>
    </defs>
    ${gridLines}
    ${yLabels}
    ${xLabels}
    <path d="${area}" fill="url(#${fillId})" />
    <path d="${path}" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <line id="hover-line" x1="0" y1="${PAD_T}" x2="0" y2="${H - PAD_B}" stroke="#5b5b63" stroke-width="1" stroke-dasharray="3,3" opacity="0" />
    <circle id="hover-dot" cx="0" cy="0" r="4" fill="${stroke}" stroke="${stroke}" opacity="0" />
    <circle cx="${lastX}" cy="${lastY}" r="5" fill="${stroke}" />
    <circle cx="${lastX}" cy="${lastY}" r="10" fill="${stroke}" opacity="0.18" />
  `;
}

svg.addEventListener('mousemove', e => {
  if (!chartPts.length) return;
  const rect = svg.getBoundingClientRect();
  const sx = ((e.clientX - rect.left) / rect.width) * W;
  let nearest = chartPts[0], minDist = Infinity;
  for (const p of chartPts) {
    const dist = Math.abs(p.x - sx);
    if (dist < minDist) { minDist = dist; nearest = p; }
  }
  showTooltip(nearest, e.clientX, e.clientY);
});
svg.addEventListener('mouseleave', () => {
  tooltip.classList.remove('show');
  const line = document.getElementById('hover-line');
  const dot = document.getElementById('hover-dot');
  if (line) line.setAttribute('opacity', '0');
  if (dot) dot.setAttribute('opacity', '0');
});

function showTooltip(pt, clientX, clientY) {
  const { d } = pt;
  const idx = viewData.findIndex(v => v.date === d.date);
  let pct = 0, diff = 0;
  if (idx > 0) {
    const prev = viewData[idx - 1].close;
    diff = d.close - prev;
    pct = (diff / prev) * 100;
  }
  tooltip.querySelector('.tt-date').textContent = formatDate(d.date);
  tooltip.querySelector('.tt-price').textContent = fmt(d.close);
  const pctEl = tooltip.querySelector('.tt-pct');
  pctEl.textContent = idx > 0 ? `${fmtDiff(diff)}  ·  ${fmtPct(pct)}` : '—';
  pctEl.className = 'tt-pct ' + (pct >= 0 ? 'up' : 'down');
  tooltip.classList.add('show');

  const wrapRect = svg.parentElement.getBoundingClientRect();
  const tx = clientX - wrapRect.left + 14;
  const ty = clientY - wrapRect.top - 30;
  const ttW = tooltip.offsetWidth;
  tooltip.style.left = Math.min(tx, wrapRect.width - ttW - 8) + 'px';
  tooltip.style.top = Math.max(8, ty) + 'px';

  const line = document.getElementById('hover-line');
  const dot = document.getElementById('hover-dot');
  if (line && dot) {
    line.setAttribute('x1', pt.x); line.setAttribute('x2', pt.x);
    line.setAttribute('opacity', '0.5');
    dot.setAttribute('cx', pt.x); dot.setAttribute('cy', pt.y);
    dot.setAttribute('opacity', '1');
  }
}

function renderTable(data) {
  const tbody = document.getElementById('tbody');
  const tableData = data.slice(-30).reverse();
  tbody.innerHTML = '';

  tableData.forEach(d => {
    const date = new Date(d.date);
    const day = date.toLocaleDateString('en-US', { weekday: 'short' });
    const full = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    const isUp = d.pct >= 0;

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="date">
        <div class="day">${day}</div>
        <div class="full">${full}</div>
      </td>
      <td class="num close">${fmt(d.close)}</td>
      <td class="num diff diff-col">${fmtDiff(d.diff)}</td>
      <td class="num pct">
        <span class="pill ${isUp ? 'up' : 'down'}">
          <span class="arrow">${isUp ? '▲' : '▼'}</span>
          ${fmtPct(d.pct)}
        </span>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

document.getElementById('range-tabs').addEventListener('click', e => {
  const btn = e.target.closest('button[data-range]');
  if (!btn) return;
  document.querySelectorAll('#range-tabs button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentRange = btn.dataset.range;
  render();
});

document.getElementById('refresh-btn').addEventListener('click', fetchData);

(function init() {
  const cached = loadCache();
  if (cached && cached.data.length) {
    allData = cached.data;
    setLive('on', `Cached · ${formatTime(new Date(cached.savedAt))}`);
    render();
    const age = Date.now() - cached.savedAt;
    if (age >= CACHE_FRESH_MS) fetchData();
  } else {
    fetchData();
  }
  setInterval(fetchData, REFRESH_INTERVAL_MS);
})();
</script>
</body>
</html>
